<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Reset Password — Padmora Sarees by Yashi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="forgot-password.html">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="auth-shell">
        <h1>Reset Your Password</h1>
        <p class="sub" id="stepSub">Enter your account email and we'll send a code to reset it.</p>
        <div class="form-error" id="formError"></div>

        <form id="emailStepForm">
          <div class="form-field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="justify-content:center;" id="emailStepSubmit">Send Reset Code</button>
        </form>

        <form id="resetStepForm" style="display:none;">
          <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;margin-bottom:18px;">If an account exists for that email, we've sent a 6-digit code — it expires in 10 minutes.</p>
          <div class="form-field">
            <label>Verification Code</label>
            <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456" required>
          </div>
          <div class="form-field">
            <label>New Password</label>
            <div class="password-field">
              <input type="password" id="newPassword" placeholder="At least 6 characters" required minlength="6">
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
            </div>
          </div>
          <div class="form-field">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="justify-content:center;">Set New Password</button>
          <p class="form-note"><a href="#" id="resendLink">Didn't get a code? Send again</a></p>
        </form>

        <p class="form-note">Remembered your password? <a href="/login">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  let submittedEmail = '';

  function showResetStep(){
    document.getElementById('stepSub').textContent = 'Almost there — enter the code and choose a new password.';
    document.getElementById('emailStepForm').style.display = 'none';
    document.getElementById('resetStepForm').style.display = 'block';
  }

  async function requestCode(email){
    const errBox = document.getElementById('formError');
    errBox.classList.remove('show');
    try{
      await apiFetch('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
      submittedEmail = email;
      showResetStep();
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
    }
  }

  document.getElementById('emailStepForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    await requestCode(document.getElementById('email').value.trim());
  });

  document.getElementById('resendLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    if(submittedEmail) await requestCode(submittedEmail);
  });

  document.getElementById('resetStepForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('formError');
    errBox.classList.remove('show');
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if(newPassword !== confirmPassword){
      errBox.textContent = 'Passwords do not match.';
      errBox.classList.add('show');
      return;
    }
    try{
      await apiFetch('/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ email: submittedEmail, code: document.getElementById('code').value.trim(), newPassword })
      });
      toast('Password updated — please log in.');
      window.location.href = '/login';
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
    }
  });

  document.getElementById('togglePassword').addEventListener('click', (e)=>{
    const input = document.getElementById('newPassword');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    e.target.textContent = showing ? 'Show' : 'Hide';
  });
</script>
</body>
</html>
