<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Packing Slip — Padmora</title>
<meta name="description" content="Packing slip.">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Thermal label: 100mm x 150mm, black on white only (thermal printers have no colour or greys). */
  *{box-sizing:border-box;}
  body{font-family:'Jost',Arial,Helvetica,sans-serif;color:#000;margin:0;padding:16px;background:#e9e6e3;}
  .slip{width:100mm;min-height:150mm;margin:0 auto 16px;padding:4mm;background:#fff;color:#000;box-shadow:0 1px 6px rgba(0,0,0,.2);}
  .slip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:3mm;border-bottom:.6mm solid #000;padding-bottom:2.5mm;margin-bottom:3mm;}
  .slip-head h1{font-family:'Marcellus',Georgia,serif;font-size:16pt;line-height:1;margin:0;font-weight:700;}
  .slip-head .brand-sub{font-size:6.5pt;text-transform:uppercase;letter-spacing:.08em;margin-top:1mm;}
  .slip-head .order-meta{text-align:right;font-size:8pt;line-height:1.35;}
  .slip-head .order-meta strong{display:block;font-size:12pt;font-weight:700;}
  .block{margin-bottom:3mm;}
  .block h4{font-size:7pt;text-transform:uppercase;letter-spacing:.08em;margin:0 0 1mm;font-weight:700;border-bottom:.2mm solid #000;padding-bottom:.6mm;}
  .block p{font-size:10pt;line-height:1.35;margin:0;word-break:break-word;}
  .block.ship p{font-size:11pt;font-weight:500;}
  .block.from p{font-size:8.5pt;}
  .block.from{margin:3mm 0 0;border-top:.5mm dashed #000;padding-top:2mm;}
  td .sub{display:block;font-size:7pt;margin-top:.5mm;}
  table{width:100%;border-collapse:collapse;margin:0 0 3mm;}
  th,td{text-align:left;padding:1.2mm .8mm;border-bottom:.2mm solid #000;font-size:8.5pt;vertical-align:top;word-break:break-word;}
  th{text-transform:uppercase;font-size:6.5pt;letter-spacing:.05em;border-bottom:.5mm solid #000;font-weight:700;}
  td.num, th.num{text-align:right;white-space:nowrap;}
  .totals{margin-left:auto;width:62mm;font-size:8.5pt;}
  .totals div{display:flex;justify-content:space-between;padding:.6mm 0;}
  .totals .grand{font-weight:700;font-size:11pt;border-top:.5mm solid #000;padding-top:1.5mm;margin-top:1mm;}
  .actions{position:sticky;top:0;background:#fff;padding:12px 16px;margin:-16px -16px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd;z-index:1;}
  .actions button, .actions a{font-family:inherit;font-size:13px;padding:10px 20px;border-radius:2px;border:1px solid #AD3B5C;background:#fff;color:#AD3B5C;cursor:pointer;text-decoration:none;}
  .actions button.primary{background:#AD3B5C;color:#fff;}
  .actions span{font-size:12px;color:#666;}
  .loading, .error{padding:60px 0;text-align:center;color:#666;}
  @page{size:100mm 150mm;margin:0;}
  @media print{
    html,body{width:100mm;margin:0;padding:0;background:#fff;}
    /* !important: the bar is shown by an inline style once the order loads, which would otherwise beat this rule */
    .actions, #padmora-cursor-lotus, #padmora-cursor-bloom, .loading{display:none !important;}
    .slip{width:100mm;min-height:0;margin:0;box-shadow:none;page-break-after:always;break-after:page;}
    .slip:last-child{page-break-after:auto;break-after:auto;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="actions" id="actionsBar" style="display:none;">
  <button class="primary" onclick="window.print()">Print</button>
  <a href="/admin">Back to Dashboard</a>
  <span id="slipCount"></span>
</div>
<div id="slipRoot"><div class="loading">Loading order…</div></div>

<script src="js/api.js"></script>
<script src="js/admin-api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const singleId = params.get('id');
  const bulkIds = (params.get('ids') || '').split(',').map(s=>s.trim()).filter(Boolean);

  async function init(){
    if(!requireAdminLogin()) return;
    const ids = singleId ? [singleId] : bulkIds;
    if(!ids.length){
      document.getElementById('slipRoot').innerHTML = '<div class="error">No order ID given.</div>';
      return;
    }
    try{
      let orders;
      if(ids.length === 1){
        const { order } = await adminApiFetch('/admin/orders/' + encodeURIComponent(ids[0]));
        orders = [order];
      }else{
        const { orders: fetched } = await adminApiFetch('/admin/orders/bulk?ids=' + ids.map(encodeURIComponent).join(','));
        orders = fetched;
      }
      if(!orders.length){
        document.getElementById('slipRoot').innerHTML = '<div class="error">None of those orders could be found.</div>';
        return;
      }
      let store = {};
      try{ store = (await adminApiFetch('/admin/settings/store')).store || {}; }catch(e){ /* slip still prints with defaults */ }
      document.getElementById('slipRoot').innerHTML = orders.map(o => slipHTML(o, store)).join('');
      document.getElementById('actionsBar').style.display = 'flex';
      fitSlips();
      document.getElementById('slipCount').textContent = orders.length > 1 ? `${orders.length} orders` : '';
      if(ids.length > orders.length){
        document.getElementById('slipCount').textContent += ` (${ids.length - orders.length} not found)`;
      }
    }catch(e){
      document.getElementById('slipRoot').innerHTML = `<div class="error">${escHTML(e.message)}</div>`;
    }
  }

  // One order = one label. A label is 150mm tall; when an order has many sarees the slip would run onto a second
  // label, so the whole slip is scaled down just enough to fit (never below 55%, so it stays readable). A normal
  // order is not touched.
  function fitSlips(){
    const maxPx = 147 / 25.4 * 96;
    document.querySelectorAll('.slip').forEach(s => {
      s.style.zoom = '';
      const keep = s.style.minHeight; s.style.minHeight = '0';
      const h = s.getBoundingClientRect().height;
      s.style.minHeight = keep;
      if(h > maxPx) s.style.zoom = Math.max(0.55, maxPx / h).toFixed(3);
    });
  }
  window.addEventListener('beforeprint', fitSlips);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitSlips);

  function money(n){ return '₹' + Number(n).toLocaleString('en-IN'); }

  // Used only when Settings → Store has no shipper address yet (same address as the storefront Contact page).
  const FALLBACK_SHIPPER = 'Padmora by Yashi Studio\nBandra West, Mumbai, Maharashtra 400050';

  function slipHTML(o, store){
    const a = o.address || {};
    const brand = (store && store.brandName) || 'Padmora';
    const shipper = (store && store.shipperAddress) || FALLBACK_SHIPPER;
    return `
    <div class="slip">
      <div class="slip-head">
        <div>
          <h1>${escHTML(brand)}</h1>
        </div>
        <div class="order-meta">
          <strong>#${escHTML(o.id)}</strong>
          ${new Date(o.placedAt).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'})}
        </div>
      </div>

      <div class="block ship">
        <h4>Delivery Address</h4>
        <p><strong>${escHTML(a.name)}</strong><br>
        ${escHTML(a.line1)}<br>
        ${escHTML(a.city)}, ${escHTML(a.state)} ${escHTML(a.pincode)}</p>
      </div>

      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th></tr></thead>
        <tbody>
          ${o.items.map(i=>`<tr><td>${escHTML(i.name)}<span class="sub">${[i.fabric, i.color ? 'Colour: ' + i.color : ''].filter(Boolean).map(escHTML).join(' · ')}</span></td><td class="num">${escHTML(i.qty)}</td><td class="num">${money(i.price)}</td></tr>`).join('')}
        </tbody>
      </table>

      <div class="totals">
        <div><span>Total price</span><span>${money(o.subtotal)}</span></div>
        <div class="grand"><span>Grand total</span><span>${money(o.total)}</span></div>
      </div>


      <div class="block from">
        <h4>Shipper Address</h4>
        <p>${escHTML(shipper).replace(/\n/g, '<br>')}</p>
      </div>
    </div>`;
  }

  init();
</script>
</body>
</html>
