<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Shop All Sarees — Padmora Sarees by Yashi</title>
<meta name="description" content="Browse our full collection of handloom sarees — Maheshwari, Ajrakh, Paithani and Narayanpet — filterable by fabric, occasion and price.">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop All Sarees — Padmora Sarees by Yashi">
<meta property="og:description" content="Browse our full collection of handloom sarees, filterable by fabric, occasion and price.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop.html">
<script>
  // /collection?slug=X is this same page; light up "Collections" (not "All
  // Sarees") in the nav before components.js builds the header.
  if (/[?&]collection=/.test(location.search) || (location.pathname === '/collection' && /[?&]slug=/.test(location.search))) document.body.setAttribute('data-page', 'collections.html');
</script>

<div id="site-header"></div>

<main>
  <section class="collection-hero" id="collectionHero" style="display:none;"></section>
  <div class="collection-meaning-wrap" id="collectionMeaning" style="display:none;"></div>

  <div class="page-banner">
    <div class="container">
      <p class="breadcrumb" id="shopBreadcrumb"><a href="/">Home</a> / All Sarees</p>
      <h1 id="shopTitle">Shop All Sarees</h1>
      <p id="shopSubtitle">Every weave, every occasion — filter to find the one.</p>
    </div>
  </div>

  <section class="section" id="shopSection" style="padding-top:36px;">
    <div class="container">
      <div class="shop-layout">
        <aside class="filters" id="filtersPanel">
          <div class="filters-drawer-head"><strong>Filters</strong><button type="button" id="filtersClose" aria-label="Close filters">&times;</button></div>
          <input type="text" class="search-page-input" id="searchInput" placeholder="Search sarees...">
          <div class="filter-group" id="fabricFilterGroup">
            <h4>Fabric</h4>
            <div id="fabricFilters"></div>
          </div>
          <div class="filter-group">
            <h4>Occasion</h4>
            <div id="occasionFilters"></div>
          </div>
          <div class="filter-group">
            <h4>Color</h4>
            <div id="colorFilters"></div>
          </div>
          <div class="filter-group">
            <h4>Price up to ₹<span id="priceLabel">25000</span></h4>
            <input type="range" min="1500" max="25000" step="500" value="25000" class="price-range" id="priceRange">
          </div>
          <button class="clear-filters" id="clearFilters">Clear all filters</button>
          <div class="filters-drawer-foot"><button type="button" class="btn btn-primary btn-block" id="filtersApply" style="justify-content:center;">Show sarees</button></div>
        </aside>
        <div class="filters-backdrop" id="filtersBackdrop"></div>

        <div>
          <div class="toolbar">
            <span class="result-count" id="resultCount">Loading…</span>
            <div class="toolbar-actions">
            <button type="button" class="filters-toggle" id="filtersToggle" aria-controls="filtersPanel" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>Filters<span class="filters-badge" id="filtersBadge" style="display:none;"></span>
            </button>
            <div class="custom-select" id="sortSelectWrap">
              <button type="button" class="custom-select-trigger" id="sortTrigger">
                <span id="sortTriggerLabel">Sort by: Popularity</span>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="custom-select-menu" id="sortMenu">
                <button type="button" class="custom-select-option" data-value="popular">Popularity<span class="check-mark">✓</span></button>
                <button type="button" class="custom-select-option" data-value="low">Price: Low to High<span class="check-mark">✓</span></button>
                <button type="button" class="custom-select-option" data-value="high">Price: High to Low<span class="check-mark">✓</span></button>
                <button type="button" class="custom-select-option" data-value="rating">Customer Rating<span class="check-mark">✓</span></button>
              </div>
            </div>
            </div>
          </div>
          <div class="product-grid" id="productGrid"></div>
          <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
            <button class="btn btn-outline" id="loadMoreBtn">Load More Sarees</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  // Populated from /api/fabrics + /api/occasions (Catalog taxonomy, admin-managed)
  // instead of a hardcoded list — a fabric/occasion added in admin shows up here
  // with zero frontend changes.
  let allFabrics = [];
  let allOccasions = [];

  const params = new URLSearchParams(window.location.search);
  let state = {
    collection: params.get('collection') || params.get('slug') || '',
    fabric: params.get('fabric') ? new Set([params.get('fabric')]) : new Set(),
    occasion: params.get('occasion') ? new Set([params.get('occasion')]) : new Set(),
    color: params.get('color') ? new Set([params.get('color')]) : new Set(),
    maxPrice: 25000,
    sort: params.get('sort') || 'popular',
    search: params.get('search') || '',
    loadedCount: 20
  };
  // Set by the last loadProducts() response — how many match in total, vs
  // how many are actually rendered (state.loadedCount, capped to that).
  let totalCount = 0;
  let loadingMore = false;

  // A collection page is this same listing, scoped to the products tagged
  // into that collection (the `collection` query param on /products), with a
  // hero banner on top. Fetched once up front so the filter lists below can be
  // limited to what's actually in the collection.
  let collectionData = null;
  async function fetchCollection(){
    if(!state.collection) return;
    try{
      collectionData = await apiFetch('/collections/' + encodeURIComponent(state.collection));
    }catch(e){
      // Unknown/inactive slug — fall back to the plain All Sarees listing.
      collectionData = null;
      state.collection = '';
    }
  }

  function esc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

  function renderCollectionHeader(){
    const hero = document.getElementById('collectionHero');
    const meaning = document.getElementById('collectionMeaning');
    const banner = document.querySelector('.page-banner');
    if(!collectionData){ hero.style.display = 'none'; meaning.style.display = 'none'; banner.style.display = ''; return; }
    const c = collectionData.collection;
    document.title = c.name + ' — Padmora Sarees by Yashi';
    const desc = document.querySelector('meta[name="description"]');
    if(desc) desc.setAttribute('content', c.description || c.tagline || ('The ' + c.name + ' collection from Padmora.'));
    banner.style.display = 'none';
    hero.innerHTML = `
      <div class="collection-hero-media" style="${c.bannerImage ? `background-image:url('${esc(c.bannerImage)}');` : ''}"></div>
      <div class="container collection-hero-inner">
        <p class="breadcrumb"><a href="/">Home</a> / <a href="/collections">Collections</a> / ${esc(c.name)}</p>
        <h1>${esc(c.name)}</h1>
        ${c.tagline ? `<p class="collection-hero-tagline">${esc(c.tagline)}</p>` : ''}
      </div>`;
    hero.style.display = '';
    // The collection's meaning/description is intentionally not shown here — the banner goes straight to the sarees.
    meaning.style.display = 'none';
    document.getElementById('shopSection').classList.add('in-collection');
  }

  // Colour has no dedicated admin taxonomy table (unlike fabric/occasion) —
  // it's a free-text swatch key on each product, so the filter list is
  // derived from whatever's actually in the catalog right now (fetched
  // unfiltered, once, so the list itself doesn't shrink as other filters
  // are applied — same expectation as the Fabric/Occasion lists).
  let allColors = [];

  async function loadTaxonomy(){
    try{
      const [{fabrics}, {occasions}, {products}] = await Promise.all([apiFetch('/fabrics'), apiFetch('/occasions'), apiFetch('/products')]);
      // A taxonomy fabric with zero products yet (admin added it ahead of
      // stocking it) would just filter down to an empty grid — hide it from
      // the checklist until there's something to actually show.
      allFabrics = fabrics.filter(f=>f.productCount > 0).map(f=>f.name);
      allOccasions = occasions.map(o=>o.name);
      allColors = [...new Set(products.map(p=>String(p.swatch||'').trim().toLowerCase()).filter(Boolean))].sort();
      // Inside a collection, only offer fabrics/colours that exist in it.
      if(collectionData){
        const inColl = collectionData.products;
        const fabricsHere = new Set(inColl.map(p=>p.fabric));
        allFabrics = allFabrics.filter(f=>fabricsHere.has(f));
        allColors = [...new Set(inColl.map(p=>String(p.swatch||'').trim().toLowerCase()).filter(Boolean))].sort();
      }
    }catch(e){
      // Backend unreachable — fall back to the last-known catalog shape so the
      // filter panel isn't just blank.
      allFabrics = ['Maheshwari','Ajrakh','Paithani','Narayanpeth'];
      allOccasions = ['Wedding','Festive','Party','Casual','Office'];
      allColors = ['maroon','emerald','ivory','teal','blush','sand','mustard','powder','wine','indigo','fuchsia','peacock'];
    }
  }

  function renderFilterOptions(){
    // A one-option fabric filter is just noise (e.g. inside a small collection).
    document.getElementById('fabricFilterGroup').style.display = allFabrics.length > 1 ? '' : 'none';
    document.getElementById('fabricFilters').innerHTML = allFabrics.map(f=>`
      <label class="filter-option"><input type="checkbox" value="${f}" class="fabricCheck" ${state.fabric.has(f)?'checked':''}> ${f}</label>`).join('');
    document.getElementById('occasionFilters').innerHTML = allOccasions.map(o=>`
      <label class="filter-option"><input type="checkbox" value="${o}" class="occasionCheck" ${state.occasion.has(o)?'checked':''}> ${o}</label>`).join('');
    document.getElementById('colorFilters').innerHTML = allColors.map(c=>`
      <label class="filter-option color-filter-option"><input type="checkbox" value="${c}" class="colorCheck" ${state.color.has(c)?'checked':''}> <span class="color-filter-dot" style="background:${swatchBg(c)};"></span>${c.charAt(0).toUpperCase()+c.slice(1)}</label>`).join('');

    document.querySelectorAll('.fabricCheck').forEach(cb=>cb.addEventListener('change',()=>{
      cb.checked ? state.fabric.add(cb.value) : state.fabric.delete(cb.value); state.loadedCount = 20; loadProducts();
    }));
    document.querySelectorAll('.occasionCheck').forEach(cb=>cb.addEventListener('change',()=>{
      cb.checked ? state.occasion.add(cb.value) : state.occasion.delete(cb.value); state.loadedCount = 20; loadProducts();
    }));
    document.querySelectorAll('.colorCheck').forEach(cb=>cb.addEventListener('change',()=>{
      cb.checked ? state.color.add(cb.value) : state.color.delete(cb.value); state.loadedCount = 20; loadProducts();
    }));
  }

  document.getElementById('priceRange').addEventListener('input', e=>{
    state.maxPrice = Number(e.target.value);
    document.getElementById('priceLabel').textContent = state.maxPrice.toLocaleString('en-IN');
    state.loadedCount = 20;
    loadProducts();
  });
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search = e.target.value; state.loadedCount = 20; loadProducts(); });
  document.getElementById('clearFilters').addEventListener('click', ()=>{
    // Keeps `collection` — clearing filters inside a collection shows the
    // whole collection again, not an unscoped escape to the full catalog.
    state = { collection: state.collection, fabric:new Set(), occasion:new Set(), color:new Set(), maxPrice:25000, sort:'popular', search:'', loadedCount:20 };
    document.getElementById('priceRange').value = 25000;
    document.getElementById('priceLabel').textContent = '25000';
    document.getElementById('searchInput').value = '';
    setSort('popular');
    renderFilterOptions();
    loadProducts();
  });

  // ---- Custom sort dropdown ----
  const SORT_LABELS = { popular:'Sort by: Popularity', low:'Price: Low to High', high:'Price: High to Low', rating:'Customer Rating' };
  function setSort(value){
    state.sort = value;
    document.getElementById('sortTriggerLabel').textContent = SORT_LABELS[value] || SORT_LABELS.popular;
    document.querySelectorAll('.custom-select-option').forEach(opt=>opt.classList.toggle('active', opt.dataset.value===value));
  }
  document.getElementById('sortTrigger').addEventListener('click', (e)=>{
    e.stopPropagation();
    document.getElementById('sortSelectWrap').classList.toggle('open');
  });
  document.querySelectorAll('.custom-select-option').forEach(opt=>opt.addEventListener('click', ()=>{
    setSort(opt.dataset.value);
    document.getElementById('sortSelectWrap').classList.remove('open');
    state.loadedCount = 20;
    loadProducts();
  }));
  document.addEventListener('click', (e)=>{
    const wrap = document.getElementById('sortSelectWrap');
    if(wrap.classList.contains('open') && !wrap.contains(e.target)) wrap.classList.remove('open');
  });

  // ---- Mobile filters drawer ----
  // On phones the filter column used to sit above the grid, so the first
  // screen was all filters. Now it's a slide-in drawer behind a "Filters"
  // button next to Sort; the sarees are the first thing you see.
  const filtersPanel = document.getElementById('filtersPanel');
  const filtersBackdrop = document.getElementById('filtersBackdrop');
  const filtersToggle = document.getElementById('filtersToggle');
  function setFiltersOpen(open){
    filtersPanel.classList.toggle('open', open);
    filtersBackdrop.classList.toggle('open', open);
    filtersToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.classList.toggle('filters-open', open);
  }
  filtersToggle.addEventListener('click', ()=>setFiltersOpen(true));
  document.getElementById('filtersClose').addEventListener('click', ()=>setFiltersOpen(false));
  document.getElementById('filtersApply').addEventListener('click', ()=>setFiltersOpen(false));
  filtersBackdrop.addEventListener('click', ()=>setFiltersOpen(false));
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') setFiltersOpen(false); });
  window.addEventListener('resize', ()=>{ if(window.innerWidth > 980) setFiltersOpen(false); });

  // Badge on the Filters button = how many filters are on; the drawer's
  // footer button shows the live result count.
  function updateFilterSummary(total){
    const n = state.fabric.size + state.occasion.size + state.color.size + (state.maxPrice < 25000 ? 1 : 0) + (state.search ? 1 : 0);
    const badge = document.getElementById('filtersBadge');
    badge.textContent = n;
    badge.style.display = n ? '' : 'none';
    document.getElementById('filtersApply').textContent = 'Show ' + total + ' saree' + (total !== 1 ? 's' : '');
  }

  let wishlistedIds = new Set();
  // Keyed by variantId -> {itemId, qty} for whatever's already in the bag, so
  // a card whose default variant is already there shows a qty stepper
  // instead of inviting a second, stacking "Add to Cart" click.
  let cartQtyByVariant = {};

  function productCardHTML(p){
    // A product with no badge set (p.badge is null/'') must show no badge at
    // all — the old fallthrough ternary defaulted anything that wasn't
    // 'sale'/'new' to 'Bestseller', which mislabeled every plain product.
    const badgeLabel = p.badge==='sale'?'Sale':p.badge==='new'?'New':p.badge==='bestseller'?'Bestseller':'';
    const isWished = wishlistedIds.has(p.id);
    const soldOut = p.stock <= 0;
    const defaultVariant = (p.variants && (p.variants.find(v=>v.isDefault) || p.variants[0])) || null;
    const cartLine = defaultVariant ? cartQtyByVariant[defaultVariant.id] : null;
    return `
    <div class="product-card ${soldOut?'sold-out':''}">
      <a href="/product?id=${p.id}" class="product-media" style="background:${productBg(p)};display:block;">
        ${soldOut ? `<div class="sold-out-ribbon"><span class="ribbon-lotus">${LOTUS_GLYPH_SVG}</span>Sold Out</div>` : (badgeLabel ? `<span class="product-badge ${p.badge}">${badgeLabel}</span>` : '')}
        <button class="wishlist-toggle ${isWished?'active':''}" aria-label="${isWished?'Remove from wishlist':'Add to wishlist'}" onclick="event.preventDefault();quickWish(${p.id}, this);">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="petal-b" d="M12 20 C6.3 18.7 1.6 13 1.4 7.3 C6.9 8.5 11.6 14.2 12 20 Z"/>
            <path class="petal-b" d="M12 20 C17.7 18.7 22.4 13 22.6 7.3 C17.1 8.5 12.4 14.2 12 20 Z"/>
            <path class="petal-a" d="M12 20 C7.5 15.2 7.5 8.2 12 4 C16.5 8.2 16.5 15.2 12 20 Z"/>
          </svg>
        </button>
        ${soldOut
          ? `<span class="quick-add">Pre Book</span>`
          : `<div class="quick-actions">
              ${cartLine && cartLine.qty > 0
                ? `<div class="card-qty-stepper">
                    <button type="button" onclick="event.preventDefault();cardChangeQty('${cartLine.itemId}', -1);">−</button><span>${cartLine.qty}</span><button type="button" onclick="event.preventDefault();cardChangeQty('${cartLine.itemId}', 1);">+</button>
                  </div>`
                : `<button type="button" onclick="event.preventDefault();quickAddToCart(${p.id}, ${defaultVariant ? defaultVariant.id : 'null'}, '${(defaultVariant ? defaultVariant.colorName : p.swatch || '').replace(/'/g, "\\'")}', this);">Add to Cart</button>`}
              <button type="button" onclick="event.preventDefault();openQuickView(${p.id});">Quick View</button>
            </div>`}
      </a>
      <div class="product-info">
        <div class="product-fabric">${p.fabric}</div>
        <a href="/product?id=${p.id}" class="product-name">${p.name}</a>
        <div class="product-rating"><span class="stars">★★★★★</span> ${p.rating} (${p.reviews})</div>
        <div class="product-price">
          <span class="price-now">${money(p.price)}</span>${priceExtrasHTML(p)}
        </div>
      </div>
    </div>`;
  }

  async function quickWish(id, btn){
    const nowActive = !wishlistedIds.has(id);
    try{
      if(nowActive){ await wishlistAdd(id); wishlistedIds.add(id); toast('Added to wishlist ♡'); }
      else{ await wishlistRemove(id); wishlistedIds.delete(id); toast('Removed from wishlist'); }
      if(btn){ btn.classList.toggle('active', nowActive); btn.setAttribute('aria-label', nowActive?'Remove from wishlist':'Add to wishlist'); }
      refreshBadgeCounts();
    }catch(e){ toast(e.message, 'error'); }
  }

  async function quickAddToCart(productId, variantId, color){
    try{
      await cartAdd(productId, 1, color, variantId);
      refreshBadgeCounts();
      toast('Added to bag');
      loadProducts();
    }catch(e){ toast(e.message, 'error'); }
  }

  async function cardChangeQty(itemId, delta){
    try{
      const cart = await cartGet();
      const item = cart.items.find(i=>i.id===itemId);
      if(!item){ loadProducts(); return; }
      const newQty = item.qty + delta;
      if(newQty <= 0){
        await cartRemoveItem(itemId);
      }else{
        if(item.product && newQty > item.product.stock){ toast(`Only ${item.product.stock} left in stock.`); return; }
        const updated = await cartUpdateQty(itemId, newQty);
        if(updated.message) toast(updated.message);
      }
      refreshBadgeCounts();
      loadProducts();
    }catch(e){ toast(e.message, 'error'); }
  }
  window.refreshProductGrid = loadProducts;

  async function loadProducts(){
    const q = new URLSearchParams();
    if(state.collection) q.set('collection', state.collection);
    if(state.fabric.size) q.set('fabric', [...state.fabric].join(','));
    if(state.occasion.size) q.set('occasion', [...state.occasion].join(','));
    if(state.color.size) q.set('color', [...state.color].join(','));
    if(state.maxPrice < 25000) q.set('maxPrice', state.maxPrice);
    if(state.search) q.set('search', state.search);
    if(state.sort) q.set('sort', state.sort);
    q.set('limit', state.loadedCount);

    try{
      const [{products, total}, wishData, cart] = await Promise.all([apiFetch('/products?' + q.toString()), wishlistGet(), cartGet()]);
      wishlistedIds = new Set(wishData.products.map(p=>p.id));
      cartQtyByVariant = {};
      cart.items.forEach(i => { if(i.variantId) cartQtyByVariant[i.variantId] = { itemId: i.id, qty: i.qty }; });
      totalCount = total;
      document.getElementById('resultCount').textContent = products.length < total
        ? `Showing ${products.length} of ${total} saree${total!==1?'s':''}`
        : `${total} saree${total!==1?'s':''}`;
      document.getElementById('productGrid').innerHTML = products.length ? products.map(productCardHTML).join('') :
        `<div class="empty-state" style="grid-column:1/-1;">No sarees match these filters just yet. Try widening your search.</div>`;
      document.getElementById('loadMoreWrap').style.display = products.length < total ? '' : 'none';
      updateFilterSummary(total);
    }catch(e){
      document.getElementById('resultCount').textContent = '';
      document.getElementById('productGrid').innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);">Could not load products — is the backend server running?</p>`;
      document.getElementById('loadMoreWrap').style.display = 'none';
    }
  }

  // 20 at a time — the "Load More" button is both a real click target and
  // the sentinel an IntersectionObserver watches, so scrolling it into view
  // loads the next batch on its own without anyone needing to click it.
  async function loadMore(){
    if(loadingMore || state.loadedCount >= totalCount) return;
    loadingMore = true;
    state.loadedCount += 20;
    await loadProducts();
    loadingMore = false;
  }
  document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
  new IntersectionObserver((entries)=>{
    if(entries[0].isIntersecting) loadMore();
  }, { rootMargin: '300px' }).observe(document.getElementById('loadMoreWrap'));

  async function init(){
    setSort(state.sort);
    document.getElementById('searchInput').value = state.search;
    await fetchCollection();
    await loadTaxonomy();
    renderFilterOptions();
    renderCollectionHeader();
    loadProducts();
  }
  init();
</script>
</body>
</html>
