<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Padmora Sarees by Yashi</title>
<meta name="description" content="Handloom and heritage sarees sourced directly from India's weaving communities — Maheshwari, Ajrakh, Paithani and Narayanpet, with honest loom-to-you provenance on every piece.">
<meta property="og:type" content="website">
<meta property="og:title" content="Padmora Sarees by Yashi">
<meta property="og:description" content="Handloom and heritage sarees sourced directly from India's weaving communities, with honest loom-to-you provenance on every piece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Even spacing at every width via gap alone, no border dividers — the old
     border-right/:last-child approach only drew correctly for a single row
     of 4 and left a dangling divider once the 980px breakpoint below wraps
     this to 2x2. */
  .trust-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border-top:1px solid rgba(173,59,92,0.12);border-bottom:1px solid rgba(173,59,92,0.12);background:rgba(173,59,92,0.1);margin-top:40px;}
  .trust-item{display:flex;align-items:center;justify-content:center;gap:12px;padding:20px 24px;background:var(--white);text-align:left;}
  .trust-item svg{width:22px;height:22px;stroke:var(--maroon);flex-shrink:0;}
  .trust-item strong{display:block;font-size:13px;}
  .trust-item span{font-size:11.5px;color:var(--ink-soft);}
  .reel-rail-wrap{position:relative;}
  .reel-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 28px 28px;scrollbar-width:none;}
  .reel-rail::-webkit-scrollbar{display:none;}
  .reel-card{flex:0 0 auto;width:190px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;position:relative;scroll-snap-align:start;box-shadow:var(--shadow);background:#1a0e10;display:block;}
  .reel-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .reel-placeholder{animation:reelPan 9s ease-in-out infinite alternate;background-size:180% 180% !important;}
  @keyframes reelPan{
    0%{background-position:20% 30%;transform:scale(1.02);}
    100%{background-position:80% 70%;transform:scale(1.12);}
  }
  .reel-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.35);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:15px;backdrop-filter:blur(2px);pointer-events:none;transition:opacity .2s ease;}
  .reel-card:hover .reel-play{opacity:0;}
  .reel-duration{position:absolute;top:10px;right:10px;font-size:10.5px;color:var(--ivory);background:rgba(0,0,0,0.4);padding:2px 8px;border-radius:20px;letter-spacing:.03em;}
  .reel-info{position:absolute;left:0;right:0;bottom:0;padding:14px 12px;background:linear-gradient(0deg, rgba(10,5,6,0.85) 0%, rgba(10,5,6,0.15) 70%, transparent 100%);}
  .reel-info strong{display:block;color:var(--ivory);font-size:12.5px;font-weight:500;line-height:1.3;font-family:var(--font-body);}
  .reel-info span{display:block;color:var(--gold-soft);font-size:11px;margin-top:3px;}
  .reel-scroll-btn{position:absolute;top:calc(50% - 14px);width:38px;height:38px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--maroon-deep);z-index:3;}
  .reel-scroll-btn.left{left:2px;}
  .reel-scroll-btn.right{right:2px;}
  @media (max-width:760px){ .reel-scroll-btn{display:none;} }

  @media (max-width:980px){
    .trust-strip{grid-template-columns:repeat(2,1fr);}
  }

  /* Full-width, admin-managed hero image — one picture for desktop, an
     optional different one under 760px, the whole thing clickable with a
     slow zoom + button invert on hover. No text of its own; the only copy is
     the centred button label, also editable from admin. */
  .home-hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#7A2740 0%,#AD3B5C 45%,#D9A97C 100%);}
  .home-hero-link{display:block;position:relative;color:inherit;}
  .home-hero-img{display:block;width:100%;height:auto;max-height:82vh;object-fit:cover;transition:transform .9s ease;}
  .home-hero-fallback{min-height:62vh;}
  .home-hero-link::after{content:'';position:absolute;inset:0;background:rgba(20,10,10,0.04);transition:background .4s ease;pointer-events:none;}
  .home-hero-link:hover::after,.home-hero-link:focus-visible::after{background:rgba(20,10,10,0.2);}
  .home-hero-link:hover .home-hero-img{transform:scale(1.045);}
  .home-hero-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;padding:16px 42px;background:rgba(250,245,236,0.94);color:var(--maroon-deep);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-radius:2px;box-shadow:0 6px 24px rgba(0,0,0,0.18);transition:background .3s ease,color .3s ease,transform .3s ease;white-space:nowrap;}
  .home-hero-link:hover .home-hero-btn,.home-hero-link:focus-visible .home-hero-btn{background:var(--maroon);color:var(--ivory);transform:translate(-50%,-50%) scale(1.05);}
  @media (max-width:760px){
    .home-hero-img{max-height:78vh;}
    .home-hero-fallback{min-height:52vh;}
    .home-hero-btn{padding:13px 30px;font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    .home-hero-img,.home-hero-btn,.home-hero-link::after{transition:none;}
    .home-hero-link:hover .home-hero-img{transform:none;}
  }
</style>
</head>
<body data-page="index.html">

<div id="site-header"></div>

<main>
  <section class="home-hero" id="heroSection" style="display:none;"></section>

  <section class="section">
    <div class="container">
      <div class="section-head"><p class="eyebrow">Curated Weaves</p><h2>Shop by Weave</h2></div>
    </div>
    <div class="cat-rail-wrap" id="catRailWrap">
      <button class="reel-scroll-btn left" id="catScrollLeft" aria-label="Scroll left">‹</button>
      <div class="container"><div class="cat-rail" id="catRail"></div></div>
      <button class="reel-scroll-btn right" id="catScrollRight" aria-label="Scroll right">›</button>
    </div>
  </section>

  <section class="section" style="padding-bottom:0;">
    <div class="container">
      <div class="section-head"><p class="eyebrow">Watch Before You Buy</p><h2>Sarees in Motion</h2></div>
    </div>
    <div class="reel-rail-wrap">
      <button class="reel-scroll-btn left" id="reelScrollLeft" aria-label="Scroll left">‹</button>
      <div class="reel-rail" id="reelRail"></div>
      <button class="reel-scroll-btn right" id="reelScrollRight" aria-label="Scroll right">›</button>
    </div>
  </section>

  <div class="trust-strip">
    <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg><div><strong>Free Shipping</strong><span id="trustShippingLine">Above ₹1,999</span></div></div>
    <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/></svg><div><strong>Easy Returns</strong><span>7-day exchange</span></div></div>
    <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><div><strong>Secure Payments</strong><span>Cards &amp; UPI</span></div></div>
    <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="9"/></svg><div><strong>Handloom Certified</strong><span>Direct from weavers</span></div></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  // Hero is admin-managed (Storefront → Hero): a desktop image, an optional
  // separate mobile image, a click-through link, and the centred button label.
  // With no image uploaded yet it falls back to the brand gradient so the
  // button still shows rather than leaving a blank gap under the header.
  function escAttr(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  async function renderHero(){
    const section = document.getElementById('heroSection');
    try{
      const {hero: h} = await apiFetch('/content/hero');
      if(!h || h.active === false){ section.style.display = 'none'; return; }
      const desktop = h.desktopImage || h.mobileImage || '';
      const link = escAttr(h.ctaLink || '/shop');
      const label = escAttr(h.ctaText || 'Shop All Sarees');
      const media = desktop
        ? `<picture>${h.mobileImage ? `<source media="(max-width:760px)" srcset="${escAttr(h.mobileImage)}">` : ''}<img class="home-hero-img" src="${escAttr(desktop)}" alt="${escAttr(h.altText || 'Padmora sarees')}"></picture>`
        : `<div class="home-hero-fallback"></div>`;
      section.innerHTML = `<a class="home-hero-link" href="${link}" aria-label="${label}">${media}<span class="home-hero-btn">${label}</span></a>`;
      section.style.display = '';
    }catch(e){ section.style.display = 'none'; }
  }

  // Admin-managed (Catalog → Fabrics) — add a fifth fabric from admin and it
  // shows up here with no frontend changes.
  async function renderCatRail(){
    try{
      const {fabrics} = await apiFetch('/fabrics');
      const rail = document.getElementById('catRail');
      // A fabric with no products yet (admin added the taxonomy entry ahead
      // of stocking it) would just lead to an empty shop grid — hide it from
      // this clickable rail until there's something to actually show.
      rail.innerHTML = fabrics.filter(f=>f.productCount > 0).map(f=>`
        <a class="cat-item" href="/shop?fabric=${encodeURIComponent(f.name)}">
          <div class="cat-swatch"><div class="cat-swatch-inner" style="background:${swatchBg(f.swatch)};"></div></div>
          <strong>${f.name}</strong>
        </a>`).join('');
      // Only show scroll arrows once there's actually more to scroll to —
      // 4 or fewer fabrics fit the row exactly and need no affordance.
      const wrap = document.getElementById('catRailWrap');
      requestAnimationFrame(()=> wrap.classList.toggle('has-overflow', rail.scrollWidth > rail.clientWidth + 4));
    }catch(e){ /* leave rail empty if the backend is unreachable */ }
  }

  function reelCardHTML(p){
    const mediaHTML = p.reelVideo
      ? `<video class="reel-media" src="${p.reelVideo}" ${p.reelThumbnail?`poster="${p.reelThumbnail}"`:''} muted loop playsinline preload="metadata"></video>`
      : p.reelThumbnail
        ? `<div class="reel-media" style="background:url('${p.reelThumbnail}') center/cover;"></div>`
        : `<div class="reel-media reel-placeholder" style="background:${swatchBg(p.swatch)};"></div>`;
    return `
    <a class="reel-card" href="/product?id=${p.id}">
      ${mediaHTML}
      <span class="reel-play">▶</span>
      <span class="reel-duration">0:${8 + (p.id % 4) * 3}</span>
      <div class="reel-info">
        <strong>${p.name}</strong>
        <span>${p.fabric} · ${money(p.price)}</span>
      </div>
    </a>`;
  }

  // Videos stay paused (showing their poster/first frame) until the shopper
  // actually hovers the card — clicking anywhere on the card still just
  // follows the link to the product page as normal.
  function bindReelHoverPlay(){
    document.querySelectorAll('#reelRail .reel-card').forEach(card=>{
      const video = card.querySelector('video.reel-media');
      if(!video) return;
      card.addEventListener('mouseenter', ()=>{ video.currentTime = 0; video.play().catch(()=>{}); });
      card.addEventListener('mouseleave', ()=>{ video.pause(); video.currentTime = 0; });
    });
  }

  async function loadReels(){
    try{
      const {products} = await apiFetch('/products/reels');
      document.getElementById('reelRail').innerHTML = products.map(reelCardHTML).join('');
      bindReelHoverPlay();
    }catch(e){
      document.getElementById('reelRail').innerHTML = '';
    }
  }

  document.getElementById('reelScrollLeft').addEventListener('click', ()=>{
    document.getElementById('reelRail').scrollBy({left: -320, behavior: 'smooth'});
  });
  document.getElementById('reelScrollRight').addEventListener('click', ()=>{
    document.getElementById('reelRail').scrollBy({left: 320, behavior: 'smooth'});
  });

  document.getElementById('catScrollLeft').addEventListener('click', ()=>{
    const rail = document.getElementById('catRail');
    rail.scrollBy({left: -rail.clientWidth, behavior: 'smooth'});
  });
  document.getElementById('catScrollRight').addEventListener('click', ()=>{
    const rail = document.getElementById('catRail');
    rail.scrollBy({left: rail.clientWidth, behavior: 'smooth'});
  });
  window.addEventListener('resize', ()=>{
    const rail = document.getElementById('catRail');
    const wrap = document.getElementById('catRailWrap');
    if(rail && wrap) wrap.classList.toggle('has-overflow', rail.scrollWidth > rail.clientWidth + 4);
  });

  renderHero();
  renderCatRail();
  loadReels();

  // Trust-strip claim should match the admin's real Phase 7 shipping
  // threshold, not a hardcoded number (the topbar already does this in
  // components.js — this is the second, separate spot with the same claim).
  apiFetch('/settings/shipping').then(({shipping})=>{
    if(shipping && shipping.freeShippingThreshold != null){
      document.getElementById('trustShippingLine').textContent = 'Above ' + money(shipping.freeShippingThreshold);
    }
  }).catch(()=>{});
</script>
</body>
</html>
