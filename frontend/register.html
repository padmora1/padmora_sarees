<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Create Account — Padmora Sarees by Yashi</title>
<meta name="description" content="Create a Padmora account to save your bag, wishlist and addresses.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register.html">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="auth-shell">
        <h1>Create Your Account</h1>
        <p class="sub" id="regSub">No password to remember &mdash; we confirm your e-mail with a 6-digit code.</p>
        <div class="form-error" id="formError"></div>

        <form id="detailsForm">
          <div class="form-field">
            <label>Full Name</label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Ananya Sharma" required maxlength="80">
          </div>
          <div class="form-field">
            <label>Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            <span class="field-hint">We send the confirmation code here, and your order updates.</span>
          </div>
          <div class="form-field">
            <label>Mobile Number</label>
            <div class="phone-row"><span class="cc">+91</span><input type="tel" id="phone" name="phone" autocomplete="tel-national" inputmode="numeric" placeholder="98765 43210" required maxlength="14"></div>
            <span class="field-hint">For delivery updates. Indian mobile numbers only.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="sendBtn" style="justify-content:center;">Send me a code</button>
        </form>

        <form id="codeForm" style="display:none;" autocomplete="off">
          <div class="code-sent" id="codeSent"></div>
          <div class="form-field">
            <label>6-digit code</label>
            <input type="text" id="code" class="code-input" name="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="verifyBtn" style="justify-content:center;">Confirm &amp; Create Account</button>
          <div class="resend-row"><span id="resendInfo"></span><button type="button" id="resendBtn" disabled>Send a new code</button></div>
        </form>

        <p class="form-note">Already have an account? <a href="/login" id="toLogin">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  const redirectTo = new URLSearchParams(window.location.search).get('redirect') || '/';
  const $ = id => document.getElementById(id);
  const errBox = $('formError');
  const showError = m => { errBox.innerHTML = ''; errBox.append(document.createTextNode(m)); errBox.classList.add('show'); };
  const clearError = () => errBox.classList.remove('show');
  let details = null, timer = null;
  $('toLogin').href = '/login' + (location.search || '');

  function startCountdown(){
    let left = 60; const btn = $('resendBtn'), info = $('resendInfo');
    clearInterval(timer); btn.disabled = true;
    const tick = () => { if(left <= 0){ clearInterval(timer); btn.disabled = false; info.textContent = 'Did not get it?'; return; } info.textContent = 'You can ask for a new code in ' + left + 's'; left--; };
    tick(); timer = setInterval(tick, 1000);
  }
  async function sendCode(d){
    return apiFetch('/auth/register/start', { method:'POST', body: JSON.stringify(d) });
  }
  $('detailsForm').addEventListener('submit', async e => {
    e.preventDefault(); clearError();
    const d = { name: $('name').value.trim(), email: $('email').value.trim(), phone: $('phone').value.trim() };
    const btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'Sending…';
    try{
      await sendCode(d);
      details = d;
      $('detailsForm').style.display = 'none'; $('codeForm').style.display = 'block'; $('regSub').style.display = 'none';
      $('codeSent').innerHTML = 'We e-mailed a 6-digit code to <strong></strong>. It works for 10 minutes. <button type="button" id="changeDetails">Change details</button>';
      $('codeSent').querySelector('strong').textContent = d.email;
      $('changeDetails').addEventListener('click', () => { $('codeForm').style.display = 'none'; $('detailsForm').style.display = 'block'; $('regSub').style.display = ''; clearInterval(timer); $('code').value = ''; clearError(); });
      $('code').focus(); startCountdown();
    }catch(err){
      showError(err.message);
      if(err.data && err.data.exists){ errBox.append(document.createTextNode(' ')); const a = document.createElement('a'); a.href = '/login' + (location.search || ''); a.textContent = 'Go to log in'; errBox.append(a); }
    }
    btn.disabled = false; btn.textContent = 'Send me a code';
  });
  $('resendBtn').addEventListener('click', async () => {
    clearError(); const b = $('resendBtn'); b.disabled = true;
    try{ await sendCode(details); toast('A new code is on its way'); startCountdown(); }
    catch(err){ showError(err.message); b.disabled = false; }
  });
  $('codeForm').addEventListener('submit', async e => {
    e.preventDefault(); clearError();
    const btn = $('verifyBtn'); btn.disabled = true; btn.textContent = 'Checking…';
    try{
      const { token, user } = await apiFetch('/auth/register/verify', { method:'POST', body: JSON.stringify({ ...details, code: $('code').value.trim() }) });
      setToken(token); setStoredUser(user);
      await mergeGuestDataIntoAccount();
      toast('Welcome to Padmora, ' + String(user.name || '').split(' ')[0] + '!');
      window.location.href = redirectTo;
    }catch(err){ showError(err.message); btn.disabled = false; btn.textContent = 'Confirm & Create Account'; $('code').select(); }
  });
  $('code').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
</script>
</body>
</html>
