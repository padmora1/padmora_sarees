<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Create Account — Padmora Sarees by Yashi</title>
<meta name="description" content="Create a Padmora account to save your bag, wishlist and addresses.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register.html">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="auth-shell">
        <h1>Create Your Account</h1>
        <p class="sub">Join Padmora for a faster checkout and order tracking.</p>
        <div class="form-error" id="formError"></div>
        <form id="registerForm">
          <div class="form-field">
            <label>Full Name</label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Ananya Sharma" required>
          </div>
          <div class="form-field">
            <label>Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            <span class="field-hint" id="emailHint"></span>
          </div>
          <div class="form-field">
            <label>Password</label>
            <div class="password-field">
              <input type="password" id="password" name="new-password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
            </div>
            <div class="strength-meter" id="strengthMeter"><span></span></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="justify-content:center;">Create Account</button>
        </form>

        <!-- Shown only when this email already has guest orders on file
             (registerForm's response comes back with requiresVerification)
             — same name/email/password already typed, just an ownership
             check before we attach a password to that existing record.
             autocomplete="one-time-code" keeps the browser from mistaking
             this for a username field next to a password form. -->
        <form id="verifyForm" style="display:none;" autocomplete="off">
          <p class="sub" style="margin-top:0;">We found previous orders under this email — enter the code we just sent to finish setting up your account.</p>
          <div class="form-field">
            <label>Verification Code</label>
            <input type="text" id="verifyCode" name="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="123456" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="justify-content:center;">Verify &amp; Create Account</button>
          <p class="form-note"><a href="#" id="resendVerifyLink">Didn't get a code? Send again</a></p>
        </form>

        <p class="form-note" id="loginNote">Already have an account? <a href="/login">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  let pendingClaim = null; // {name, email, password} — held only in memory while step 2 is shown

  function showVerifyStep(){
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginNote').style.display = 'none';
    document.getElementById('verifyForm').style.display = 'block';
  }

  async function submitRegister(){
    const errBox = document.getElementById('formError');
    errBox.classList.remove('show');
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try{
      const data = await apiFetch('/auth/register', {
        method:'POST',
        body: JSON.stringify({ name, email, password })
      });
      if(data.requiresVerification){
        pendingClaim = { name, email, password };
        showVerifyStep();
        return;
      }
      setToken(data.token);
      setStoredUser(data.user);
      await mergeGuestDataIntoAccount();
      toast('Welcome to Padmora, ' + data.user.name.split(' ')[0] + '!');
      window.location.href = '/account';
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
    }
  }

  document.getElementById('registerForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    await submitRegister();
  });

  document.getElementById('resendVerifyLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    if(pendingClaim) await submitRegister();
  });

  document.getElementById('verifyForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('formError');
    errBox.classList.remove('show');
    try{
      const { token, user } = await apiFetch('/auth/register/verify', {
        method:'POST',
        body: JSON.stringify({ ...pendingClaim, code: document.getElementById('verifyCode').value.trim() })
      });
      setToken(token);
      setStoredUser(user);
      await mergeGuestDataIntoAccount();
      toast('Welcome to Padmora, ' + user.name.split(' ')[0] + '!');
      window.location.href = '/account';
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
    }
  });

  document.getElementById('togglePassword').addEventListener('click', (e)=>{
    const input = document.getElementById('password');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    e.target.textContent = showing ? 'Show' : 'Hide';
  });

  document.getElementById('email').addEventListener('input', (e)=>{
    const hint = document.getElementById('emailHint');
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value);
    hint.textContent = (!e.target.value || valid) ? '' : 'That doesn\'t look like a valid email address.';
  });

  document.getElementById('password').addEventListener('input', (e)=>{
    const val = e.target.value;
    let score = 0;
    if(val.length >= 6) score++;
    if(val.length >= 10) score++;
    if(/[0-9]/.test(val) && /[a-zA-Z]/.test(val)) score++;
    if(/[^a-zA-Z0-9]/.test(val)) score++;
    const meter = document.getElementById('strengthMeter');
    meter.className = 'strength-meter' + (val ? ' level-' + score : '');
  });
</script>
</body>
</html>
