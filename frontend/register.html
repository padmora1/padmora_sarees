<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Create Account — Padmora Sarees by Yashi</title>
<meta name="description" content="Create a Padmora account to save your bag, wishlist and addresses.">
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register.html">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="auth-shell">
        <h1>Create Your Account</h1>
        <p class="sub" id="regSub">No password to remember &mdash; we confirm your e-mail with a 6-digit code.</p>
        <div class="form-error" id="formError"></div>

        <form id="detailsForm" novalidate>
          <div class="form-field">
            <label>Full Name *</label>
            <input type="text" id="name" name="name" autocomplete="name" required maxlength="80">
          </div>
          <div class="form-field">
            <label>Email Address *</label>
            <input type="email" id="email" name="email" autocomplete="email" required maxlength="254">
            <span class="field-hint">We send the confirmation code here, and your order updates.</span>
          </div>
          <div class="form-field">
            <label>Mobile Number *</label>
            <div class="phone-row"><select id="countryCode" class="cc-select" name="country-code" aria-label="Country code"><option value="91" selected>+91 India</option><option value="61">+61 Australia</option><option value="973">+973 Bahrain</option><option value="880">+880 Bangladesh</option><option value="1">+1 Canada</option><option value="86">+86 China</option><option value="45">+45 Denmark</option><option value="33">+33 France</option><option value="49">+49 Germany</option><option value="852">+852 Hong Kong</option><option value="62">+62 Indonesia</option><option value="353">+353 Ireland</option><option value="972">+972 Israel</option><option value="39">+39 Italy</option><option value="81">+81 Japan</option><option value="254">+254 Kenya</option><option value="965">+965 Kuwait</option><option value="60">+60 Malaysia</option><option value="960">+960 Maldives</option><option value="230">+230 Mauritius</option><option value="977">+977 Nepal</option><option value="31">+31 Netherlands</option><option value="64">+64 New Zealand</option><option value="234">+234 Nigeria</option><option value="47">+47 Norway</option><option value="968">+968 Oman</option><option value="92">+92 Pakistan</option><option value="63">+63 Philippines</option><option value="974">+974 Qatar</option><option value="7">+7 Russia</option><option value="966">+966 Saudi Arabia</option><option value="65">+65 Singapore</option><option value="27">+27 South Africa</option><option value="82">+82 South Korea</option><option value="34">+34 Spain</option><option value="94">+94 Sri Lanka</option><option value="46">+46 Sweden</option><option value="41">+41 Switzerland</option><option value="66">+66 Thailand</option><option value="971">+971 United Arab Emirates</option><option value="44">+44 United Kingdom</option><option value="1">+1 United States</option></select><input type="tel" id="phone" name="phone" autocomplete="tel-national" inputmode="numeric" required maxlength="16"></div>
            <span class="field-hint">For delivery updates. Choose your country code, then type the number without it.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="sendBtn" style="justify-content:center;">Send me a code</button>
        </form>

        <form id="codeForm" style="display:none;" autocomplete="off">
          <div class="code-sent" id="codeSent"></div>
          <div class="form-field">
            <label>6-digit code</label>
            <input type="text" id="code" class="code-input" name="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="verifyBtn" style="justify-content:center;">Confirm &amp; Create Account</button>
          <div class="resend-row"><span id="resendInfo"></span><button type="button" id="resendBtn" disabled>Send a new code</button></div>
        </form>

        <p class="form-note">Already have an account? <a href="/login" id="toLogin">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  const redirectTo = new URLSearchParams(window.location.search).get('redirect') || '/';
  const $ = id => document.getElementById(id);
  const errBox = $('formError');
  const showError = m => { errBox.innerHTML = ''; errBox.append(document.createTextNode(m)); errBox.classList.add('show'); };
  const clearError = () => errBox.classList.remove('show');
  let details = null, timer = null;
  $('toLogin').href = '/login' + (location.search || '');

  function startCountdown(){
    let left = 60; const btn = $('resendBtn'), info = $('resendInfo');
    clearInterval(timer); btn.disabled = true;
    const tick = () => { if(left <= 0){ clearInterval(timer); btn.disabled = false; info.textContent = 'Did not get it?'; return; } info.textContent = 'You can ask for a new code in ' + left + 's'; left--; };
    tick(); timer = setInterval(tick, 1000);
  }
  async function sendCode(d){
    return apiFetch('/auth/register/start', { method:'POST', body: JSON.stringify(d) });
  }
  $('detailsForm').addEventListener('submit', async e => {
    e.preventDefault(); clearError();
    const d = { name: $('name').value.trim().replace(/\s+/g, ' '), email: $('email').value.trim(), phone: $('phone').value.trim(), countryCode: $('countryCode').value };
    // all three are required, and the e-mail must be a real-looking address (the server checks again)
    const bad = (id, message) => { showError(message); $(id).classList.add('invalid'); $(id).focus(); $(id).addEventListener('input', () => $(id).classList.remove('invalid'), { once: true }); };
    ['name', 'email', 'phone'].forEach(id => $(id).classList.remove('invalid'));
    if(d.name.length < 2) return bad('name', 'Enter your full name.');
    if(!d.email) return bad('email', 'Enter your email address.');
    if(!isValidEmail(d.email)) return bad('email', 'Enter a valid email address, for example name@example.com.');
    if(!d.phone) return bad('phone', 'Enter your mobile number.');
    if(d.countryCode === '91' ? !isValidIndianMobile(d.phone) : !/^\d{5,13}$/.test(d.phone.replace(/[\s-]/g, ''))){
      return bad('phone', d.countryCode === '91' ? 'Enter a valid 10-digit Indian mobile number (it starts with 6, 7, 8 or 9).' : 'Enter a valid mobile number without the country code.');
    }
    const btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'Sending…';
    try{
      await sendCode(d);
      details = d;
      $('detailsForm').style.display = 'none'; $('codeForm').style.display = 'block'; $('regSub').style.display = 'none';
      $('codeSent').innerHTML = 'We e-mailed a 6-digit code to <strong></strong>. It works for 10 minutes. <button type="button" id="changeDetails">Change details</button>';
      $('codeSent').querySelector('strong').textContent = d.email;
      $('changeDetails').addEventListener('click', () => { $('codeForm').style.display = 'none'; $('detailsForm').style.display = 'block'; $('regSub').style.display = ''; clearInterval(timer); $('code').value = ''; clearError(); });
      $('code').focus(); startCountdown();
    }catch(err){
      showError(err.message);
      if(err.data && err.data.exists){ errBox.append(document.createTextNode(' ')); const a = document.createElement('a'); a.href = '/login' + (location.search || ''); a.textContent = 'Go to log in'; errBox.append(a); }
    }
    btn.disabled = false; btn.textContent = 'Send me a code';
  });
  $('resendBtn').addEventListener('click', async () => {
    clearError(); const b = $('resendBtn'); b.disabled = true;
    try{ await sendCode(details); toast('A new code is on its way'); startCountdown(); }
    catch(err){ showError(err.message); b.disabled = false; }
  });
  $('codeForm').addEventListener('submit', async e => {
    e.preventDefault(); clearError();
    const btn = $('verifyBtn'); btn.disabled = true; btn.textContent = 'Checking…';
    try{
      const { token, user } = await apiFetch('/auth/register/verify', { method:'POST', body: JSON.stringify({ ...details, code: $('code').value.trim() }) });
      setToken(token); setStoredUser(user);
      await mergeGuestDataIntoAccount();
      toast('Welcome to Padmora, ' + String(user.name || '').split(' ')[0] + '!');
      window.location.href = redirectTo;
    }catch(err){ showError(err.message); btn.disabled = false; btn.textContent = 'Confirm & Create Account'; $('code').select(); }
  });
  $('code').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
</script>
</body>
</html>
