<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log In — Padmora by Yashi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login.html">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="auth-shell">
        <h1>Welcome Back</h1>
        <p class="sub">Log in to view your orders, wishlist and bag.</p>
        <div class="form-error" id="formError"></div>
        <form id="loginForm">
          <div class="form-field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-field">
            <label>Password</label>
            <div class="password-field">
              <input type="password" id="password" placeholder="••••••••" required>
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="justify-content:center;">Log In</button>
        </form>
        <p class="form-note">New to Padmora? <a href="/register">Create an account</a></p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  const redirectTo = new URLSearchParams(window.location.search).get('redirect') || '/';

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('formError');
    errBox.classList.remove('show');
    try{
      const { token, user } = await apiFetch('/auth/login', {
        method:'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      setToken(token);
      setStoredUser(user);
      await mergeGuestDataIntoAccount();
      toast('Welcome back, ' + user.name.split(' ')[0] + '!');
      window.location.href = redirectTo;
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
    }
  });

  document.getElementById('togglePassword').addEventListener('click', (e)=>{
    const input = document.getElementById('password');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    e.target.textContent = showing ? 'Show' : 'Hide';
  });
</script>
</body>
</html>
