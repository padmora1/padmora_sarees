<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Wishlist — Padmora by Yashi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="wishlist.html">

<div id="site-header"></div>

<main>
  <div class="page-banner">
    <div class="container">
      <p class="breadcrumb"><a href="/">Home</a> / Wishlist</p>
      <h1>Your Wishlist</h1>
    </div>
  </div>

  <section class="section" style="padding-top:36px;">
    <div class="container">
      <div class="product-grid" id="wishlistGrid"><div class="loading-state" style="grid-column:1/-1;">
        <span class="zari-spinner"></span>Loading your wishlist…
      </div></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  function cardHTML(p){
    const off = Math.round((1 - p.price/p.mrp)*100);
    // priceDropped/priceAtAdd only exist for a logged-in customer's wishlist
    // (the server remembers what price they saw when they added it) — a
    // guest's localStorage wishlist has no baseline, so this badge simply
    // doesn't render for guests rather than showing something we can't verify.
    const priceBadge = p.priceDropped ? `<span class="wishlist-alert-badge drop">Price dropped from ${money(p.priceAtAdd)}</span>` : '';
    const soldOut = p.stock <= 0;
    return `
    <div class="product-card ${soldOut?'sold-out':''}">
      <a href="/product?id=${p.id}" class="product-media" style="background:${swatchBg(p.swatch)};display:block;">
        ${soldOut ? `<div class="sold-out-ribbon"><span class="ribbon-lotus">${LOTUS_GLYPH_SVG}</span>Sold Out</div>` : ''}
        <button class="wishlist-toggle active" aria-label="Remove from wishlist" onclick="event.preventDefault();removeWish(${p.id});">
          <svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M12 21s-7.5-4.7-10-9.3C.3 8 2 4.5 5.6 4.1c2-.2 3.8.8 4.4 2.5.6-1.7 2.4-2.7 4.4-2.5C18 4.5 19.7 8 22 11.7 19.5 16.3 12 21 12 21z"/></svg>
        </button>
        ${p.stock > 0 ? `<span class="quick-add" onclick="event.preventDefault();moveToCart(${p.id});">Add to Bag</span>` : `<span class="quick-add">Pre Book</span>`}
      </a>
      <div class="product-info">
        ${priceBadge}
        <div class="product-fabric">${p.fabric}</div>
        <a href="/product?id=${p.id}" class="product-name">${p.name}</a>
        <div class="product-price">
          <span class="price-now">${money(p.price)}</span>
          <span class="price-mrp">${money(p.mrp)}</span>
          <span class="price-off">${off}% off</span>
        </div>
      </div>
    </div>`;
  }

  async function loadWishlist(){
    try{
      const {products} = await wishlistGet();
      const grid = document.getElementById('wishlistGrid');
      grid.innerHTML = products.length ? products.map(cardHTML).join('') :
        `<div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.3"><path d="M12 21s-7.5-4.7-10-9.3C.3 8 2 4.5 5.6 4.1c2-.2 3.8.8 4.4 2.5.6-1.7 2.4-2.7 4.4-2.5C18 4.5 19.7 8 22 11.7 19.5 16.3 12 21 12 21z"/></svg>
          <p>Your wishlist is empty.<br>Tap the heart on any saree to save it here.</p>
          <a href="/shop" class="btn btn-primary" style="margin-top:20px;">Browse Sarees</a>
        </div>`;
    }catch(e){
      document.getElementById('wishlistGrid').innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);">Could not load your wishlist.</p>`;
    }
  }

  async function removeWish(id){
    try{ await wishlistRemove(id); toast('Removed from wishlist'); loadWishlist(); refreshBadgeCounts(); }
    catch(e){ toast(e.message, 'error'); }
  }
  async function moveToCart(id){
    try{
      await cartAdd(id, 1, 'default', null);
      await wishlistRemove(id);
      toast('Added to bag');
      loadWishlist(); refreshBadgeCounts();
    }catch(e){ toast(e.message, 'error'); }
  }

  loadWishlist();
</script>
</body>
</html>
