<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<title>Your Bag — Padmora Sarees by Yashi</title>
<meta name="description" content="Review the sarees in your bag before checkout.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fxjlgsatgajagzqdokbe.supabase.co" crossorigin>
<link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<style>main{min-height:85vh;}</style>
</head>
<body data-page="cart.html">

<div id="site-header"></div>

<main>
  <div class="page-banner">
    <div class="container">
      <p class="breadcrumb"><a href="/">Home</a> / Your Bag</p>
      <h1>Your Bag</h1>
    </div>
  </div>

  <section class="section" style="padding-top:36px;">
    <div class="container">
      <div id="cartContent"><div class="loading-state"><span class="zari-spinner"></span>Loading your bag…</div></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/cursor.js"></script>
<script>
  let cart = { items: [], subtotal: 0, discount: 0, total: 0, coupon: null };

  function renderCart(){
    const wrap = document.getElementById('cartContent');
    const items = cart.items;
    if(!items.length){
      wrap.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.3"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <p>Your bag is empty.<br>Time to find a saree you love.</p>
        <a href="/shop" class="btn btn-primary" style="margin-top:20px;">Browse Sarees</a>
      </div>`;
      return;
    }

    wrap.innerHTML = `
      ${!isLoggedIn() ? `<div class="form-error show" style="background:rgba(31,75,74,0.08);color:var(--teal);">Shopping as a guest — <a href="/login?redirect=/cart" style="color:var(--teal);text-decoration:underline;">log in</a> to save your bag across devices and check out.</div>` : ''}
      <div class="cart-layout">
        <div>
          ${items.map((item)=>`
            <div class="cart-line">
              <div class="cart-thumb" style="background:${photoBg(item.imageUrl, item.color, 120)};"></div>
              <div class="cart-line-info">
                <h4>${item.product.name}</h4>
                <span>${item.product.fabric}</span>
                <div class="qty-stepper">
                  <button data-dec="${item.id}">−</button><span>${item.qty}</span><button data-inc="${item.id}">+</button>
                </div>
                <div class="remove-line" data-remove="${item.id}">Remove</div>
              </div>
              <div class="cart-line-price">${money(item.product.price * item.qty)}</div>
            </div>`).join('')}
        </div>
        <div class="summary-card">
          <h3>Order Summary</h3>
          <div class="promo-row">
            <input type="text" placeholder="Promo code (try PADMORA40)" id="promoInput" value="${cart.coupon || ''}">
            <button id="promoApply">${cart.coupon ? 'Remove' : 'Apply'}</button>
          </div>
          <div class="summary-row"><span>Subtotal</span><span>${money(cart.subtotal)}</span></div>
          ${cart.discount > 0 ? `<div class="summary-row"><span>Discount ${cart.coupon ? '(' + cart.coupon + ')' : ''}</span><span>−${money(cart.discount)}</span></div>` : ''}
          <div class="summary-row"><span>Shipping</span><span>${cart.shippingFee > 0 ? money(cart.shippingFee) : 'Free'}</span></div>
          <div class="summary-row total"><span>Total</span><span>${money(cart.total)}</span></div>
          <a href="/checkout" class="btn btn-primary btn-block" style="margin-top:16px;justify-content:center;">Proceed to Checkout</a>
        </div>
      </div>`;

    document.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.inc, 1)));
    document.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.dec, -1)));
    document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>removeItem(b.dataset.remove)));
    document.getElementById('promoApply').addEventListener('click', applyPromo);
  }

  // + / - / Remove show their result at once (quantity, line price, subtotal, header badge) and the server catches
  // up in the background, one change at a time and in order. When the last one is confirmed the exact totals
  // (discount, shipping, tax) from the server replace the quick estimate; if anything fails the real bag is reloaded.
  let cartPending = 0, cartChain = Promise.resolve();
  function queueCartOp(op){
    cartPending++;
    cartChain = cartChain.then(op).then(res => {
      cartPending--;
      if(res && res.message) toast(res.message);
      if(cartPending === 0 && res){ cart = res; renderCart(); refreshBadgeCounts(); }
    }).catch(async e => {
      cartPending--;
      toast(e.message, 'error');
      if(cartPending === 0){ try{ cart = await cartGet(); renderCart(); refreshBadgeCounts(); }catch(e2){ /* keep what is shown */ } }
    });
  }
  function recomputeTotals(){
    cart.subtotal = cart.items.reduce((sum, i) => sum + (i.product ? i.product.price * i.qty : 0), 0);
    cart.total = Math.max(0, cart.subtotal - (cart.discount || 0)) + (cart.shippingFee || 0);
    if(typeof setCartBadge === 'function') setCartBadge(cart.items.reduce((sum, i) => sum + i.qty, 0));
  }

  function changeQty(itemId, delta){
    const item = cart.items.find(i=>i.id===itemId);
    if(!item) return;
    const newQty = item.qty + delta;
    if(newQty <= 0) return removeItem(itemId);
    if(delta > 0 && item.product && newQty > item.product.stock){
      toast(`Only ${item.product.stock} left in stock.`);
      return;
    }
    item.qty = newQty;
    recomputeTotals(); renderCart();
    queueCartOp(() => cartUpdateQty(itemId, newQty));
  }
  function removeItem(itemId){
    cart.items = cart.items.filter(i => i.id !== itemId);
    recomputeTotals(); renderCart();
    queueCartOp(() => cartRemoveItem(itemId));
  }
  async function applyPromo(){
    if(cart.coupon){
      try{ cart = await cartRemoveCoupon(); toast('Promo code removed'); renderCart(); }
      catch(e){ toast(e.message, 'error'); }
      return;
    }
    const code = document.getElementById('promoInput').value.trim();
    if(!code) return;
    try{
      cart = await cartApplyCoupon(code);
      toast(`Promo code applied — ${money(cart.discount)} off!`);
      renderCart();
    }catch(e){ toast(e.message, 'error'); }
  }

  async function init(){
    try{
      cart = await cartGet();
      renderCart();
    }catch(e){
      document.getElementById('cartContent').innerHTML = `<p style="text-align:center;color:var(--ink-soft);">Could not load your bag. Please try again.</p>`;
    }
  }
  init();
</script>
</body>
</html>
